[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yummysoup2paprika"
version = "0.1.0"
description = "Convert YummySoup! libraries to Paprika Recipe Manager 3 archives"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "yummysoup2paprika contributors"}]
keywords = ["YummySoup", "Paprika", "recipes", "conversion", "macOS"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]

dependencies = []

[project.scripts]
yummysoup2paprika = "yummysoup2paprika.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
